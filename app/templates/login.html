{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Iniciar sesión</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {% if modo == 'secure' %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endif %}
    <label>Usuario
      <input name="username" autocomplete="username" required>
    </label>
    <label>Contraseña
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Entrar</button>
  </form>
  <p class="note">Perfiles ficticios: <code>s_tio</code> (socio), <code>c_contador</code>, <code>a_auxiliar</code>.</p>
</section>
{% endblock %}
